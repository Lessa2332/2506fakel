<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🔥 Запали факел!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    body { background: linear-gradient(135deg, #1a0a2e 0%, #0d0d2b 100%); overflow: hidden; font-family: 'Arial', sans-serif; color: white; height: 100vh; width: 100vw; }
    #video, #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    #video { z-index: 1; display: none; }
    #canvas { z-index: 2; display: none; }

    #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a0a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
    .loader { width: 60px; height: 60px; border: 4px solid #fff; border-top: 4px solid #FFD700; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    #wishText, #flameStatus, #handIndicator, #micBtn, #progressContainer, #progressLabel {
        position: fixed; z-index: 100; left: 50%; transform: translateX(-50%); text-align: center;
    }
    #wishText { bottom: 30px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 20px; border: 2px solid #FFD700; color: #FFD700; display: none; }
    #micBtn { bottom: 40px; padding: 15px 30px; border-radius: 30px; background: #4CAF50; border: 3px solid #FFD700; color: white; font-weight: bold; cursor: pointer; }
    #progressContainer { bottom: 110px; width: 280px; height: 20px; background: rgba(255,255,255,0.2); border-radius: 10px; display: none; overflow: hidden; }
    #progressFill { height: 100%; width: 0%; background: #FF4500; transition: width 0.1s; }
  </style>
</head>
<body>
  <div id="loading"><div class="loader"></div><p>Завантаження камери...</p></div>
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="wishText">💨 Дмухай, щоб запалити!</div>
  <div id="flameStatus" style="top: 80px; display: none;">🔥 Факел не горить</div>
  <div id="handIndicator" style="top: 20px;">👋 Покажіть долоню</div>
  <div id="progressContainer"><div id="progressFill"></div></div>
  <div id="progressLabel" style="bottom: 135px; display: none;">0 с</div>
  <button id="micBtn">🎙️ Увімкнути мікрофон</button>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';
    import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm";

    let scene, camera, renderer, torchSprite, candle, flameGroup, handLandmarker;
    const state = { landmarks: null, isFlameLit: false, isMicActive: false, isBlowing: false, blowStartTime: null };

    async function init() {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const video = document.getElementById('video');
        video.srcObject = stream;
        await video.play();

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.z = 2;
        renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // Створюємо групу полум'я
        candle = new THREE.Group();
        flameGroup = new THREE.Group();
        // Збільшуємо масштаб тут:
        flameGroup.scale.set(4, 4, 4); 
        
        const geometry = new THREE.ConeGeometry(0.1, 0.3, 16);
        const material = new THREE.MeshBasicMaterial({ color: 0xff4500 });
        const flame = new THREE.Mesh(geometry, material);
        flameGroup.add(flame);
        
        candle.add(flameGroup);
        scene.add(candle);

        const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
        handLandmarker = await HandLandmarker.createFromOptions(vision, { baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" }, runningMode: "VIDEO" });

        document.getElementById('loading').style.display = 'none';
        document.getElementById('micBtn').onclick = () => { state.isMicActive = true; document.getElementById('micBtn').style.display = 'none'; };
        
        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        if (handLandmarker && document.getElementById('video').readyState >= 2) {
            const results = handLandmarker.detectForVideo(document.getElementById('video'), performance.now());
            if (results.landmarks.length > 0) {
                state.landmarks = results.landmarks[0];
                const tip = state.landmarks[12]; // Середній палець
                
                // Перерахунок координат
                const x = (tip.x - 0.5) * 4;
                const y = (0.5 - tip.y) * 3;
                
                candle.position.set(x, y, 0);
                candle.visible = true;
                flameGroup.visible = state.isFlameLit;
                document.getElementById('wishText').style.display = 'block';
            }
        }
        renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
