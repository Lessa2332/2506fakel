<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🔥 Запали факел!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
        body { background: #0d0d2b; overflow: hidden; font-family: sans-serif; color: white; height: 100vh; width: 100vw; }
        #video, #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #video { z-index: 1; }
        #canvas { z-index: 2; }
        #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; background: #0d0d2b; }
        .loader { width: 50px; height: 50px; border: 5px solid #333; border-top: 5px solid #FFD700; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #micBtn { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); padding: 15px 30px; border-radius: 30px; background: #4CAF50; border: 2px solid #FFD700; color: white; font-weight: bold; z-index: 100; cursor: pointer; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loader"></div>
        <p style="margin-top:20px;">Завантаження магії...</p>
    </div>
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    <button id="micBtn">🎙️ Увімкнути мікрофон</button>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';
        import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm";

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const micBtn = document.getElementById('micBtn');
        let handLandmarker;

        async function initApp() {
            try {
                // 1. Камера
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });

                // 2. MediaPipe (виправлено ініціалізацію)
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
                handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                        delegate: "GPU" 
                    },
                    runningMode: "VIDEO",
                    numHands: 1
                });

                document.getElementById('loading').style.display = 'none';
                renderLoop();
            } catch (e) {
                console.error(e);
                alert("Помилка: " + e.message);
            }
        }

        function renderLoop() {
            if (video.readyState >= 2) {
                const results = handLandmarker.detectForVideo(video, performance.now());
                // Тут ваша логіка рендерінгу Three.js
            }
            requestAnimationFrame(renderLoop);
        }

        micBtn.addEventListener('click', async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            // ... ваша логіка мікрофона
            micBtn.style.display = 'none';
        });

        initApp();
    </script>
</body>
</html>
