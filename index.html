<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🔥 Запали факел!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
            user-select: none;
        }
        body {
            background: #0d0d2b;
            overflow: hidden;
            font-family: 'Arial', 'Segoe UI', system-ui, sans-serif;
            color: #fff;
            height: 100vh;
            width: 100vw;
        }
        #video,
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #video {
            z-index: 1;
            display: none;
            transform: scaleX(-1);
        }
        #canvas {
            z-index: 2;
            display: none;
        }

        /* Loading */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0a2e 0%, #0d0d2b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            text-align: center;
            padding: 20px;
            transition: opacity 0.8s ease;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top: 4px solid #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* UI елементи */
        #wishText {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #FFD700;
            padding: 14px 22px;
            border-radius: 20px;
            font-size: clamp(1rem, 5vw, 1.6rem);
            font-weight: bold;
            z-index: 85;
            text-align: center;
            border: 2px solid #FFD700;
            display: none;
            max-width: 92%;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
            line-height: 1.4;
            transition: all 0.4s ease;
            pointer-events: none;
        }
        #wishText.lit {
            color: #fff;
            border-color: #FF8C00;
            background: linear-gradient(135deg, rgba(255, 69, 0, 0.85), rgba(255, 140, 0, 0.85));
            box-shadow: 0 0 50px rgba(255, 69, 0, 0.5);
        }

        #handIndicator {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #FFD700;
            padding: 12px 20px;
            border-radius: 20px;
            border: 2px solid rgba(255, 215, 0, 0.5);
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 99;
            font-size: clamp(0.9rem, 3.5vw, 1.2rem);
            font-weight: bold;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
            pointer-events: none;
        }

        #flameStatus {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #FF4500 0%, #FF6347 100%);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: clamp(0.85rem, 3.5vw, 1.2rem);
            z-index: 100;
            display: none;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 30px rgba(255, 69, 0, 0.5);
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            transition: all 0.6s ease;
        }
        #flameStatus.lit {
            background: linear-gradient(135deg, #FFD700 0%, #FF8C00 100%);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.7);
            border-color: #FFD700;
        }

        #micBtn {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 32px;
            border-radius: 30px;
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            border: 3px solid #FFD700;
            color: #fff;
            font-size: clamp(1rem, 4vw, 1.3rem);
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 0 30px rgba(76, 175, 80, 0.5);
            transition: all 0.3s ease;
            touch-action: manipulation;
            white-space: nowrap;
            animation: pulse-btn 2.5s infinite;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }
        #micBtn:active {
            transform: translateX(-50%) scale(0.95);
        }
        #micBtn.hidden {
            display: none;
        }
        #micBtn.mic-on {
            background: linear-gradient(135deg, #f44336, #c62828);
            border-color: #FF6F00;
            animation: none;
            box-shadow: 0 0 40px rgba(244, 67, 54, 0.6);
        }

        @keyframes pulse-btn {
            0%,
            100% {
                transform: translateX(-50%) scale(1);
            }
            50% {
                transform: translateX(-50%) scale(1.06);
            }
        }

        #progressContainer {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: min(300px, 82%);
            height: 18px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 30px;
            z-index: 90;
            display: none;
            overflow: hidden;
            border: 2px solid rgba(255, 215, 0, 0.35);
            backdrop-filter: blur(4px);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.15);
        }
        #progressFill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #FFD700, #FF6F00, #FF4500);
            border-radius: 30px;
            transition: width 0.15s ease;
            box-shadow: 0 0 20px #FFD700;
        }
        #progressLabel {
            position: fixed;
            bottom: 135px;
            left: 50%;
            transform: translateX(-50%);
            color: #FFD700;
            font-size: clamp(0.7rem, 2.5vw, 1rem);
            z-index: 91;
            display: none;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            pointer-events: none;
        }

        #debugPanel {
            position: fixed;
            top: 130px;
            right: 10px;
            background: rgba(0, 0, 0, 0.85);
            color: #4CAF50;
            padding: 12px 16px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            z-index: 200;
            display: none;
            border: 1px solid #4CAF50;
            backdrop-filter: blur(5px);
            max-width: 200px;
            pointer-events: none;
            line-height: 1.6;
        }

        /* Mobile tweaks */
        @media (max-width: 480px) {
            #wishText {
                bottom: 20px;
                padding: 12px 16px;
                font-size: 0.95rem;
            }
            #handIndicator {
                top: 10px;
                padding: 8px 16px;
                font-size: 0.85rem;
            }
            #flameStatus {
                top: 58px;
                padding: 8px 16px;
                font-size: 0.85rem;
            }
            #micBtn {
                font-size: 0.95rem;
                padding: 12px 22px;
                bottom: 28px;
            }
            #progressContainer {
                bottom: 90px;
                height: 14px;
                width: min(260px, 80%);
            }
            #progressLabel {
                bottom: 110px;
                font-size: 0.8rem;
            }
        }
        @media (max-height: 700px) {
            #micBtn {
                font-size: 0.85rem;
                padding: 10px 18px;
                bottom: 18px;
            }
            #progressContainer {
                bottom: 76px;
                height: 12px;
            }
            #progressLabel {
                bottom: 94px;
            }
            #wishText {
                bottom: 12px;
                padding: 8px 14px;
                font-size: 0.85rem;
            }
            #flameStatus {
                top: 48px;
                padding: 6px 14px;
                font-size: 0.8rem;
            }
            #handIndicator {
                top: 8px;
                padding: 6px 14px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- Loading -->
    <div id="loading">
        <div class="loader"></div>
        <div style="font-size: 1.6rem; font-weight: 600; margin-bottom: 8px;">🔥 Завантаження...</div>
        <p style="margin-top: 16px; color: rgba(255,255,255,0.85); font-size: 1.1rem;">Покажіть долоню камері</p>
        <p style="margin-top: 6px; color: rgba(255,255,255,0.5); font-size: 0.85rem;">(для найкращої роботи тримайте руку на відстані 30–50 см)</p>
    </div>

    <!-- Video & Canvas -->
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>

    <!-- UI -->
    <div id="wishText">🔥 Дмухай на факел, щоб запалити!</div>
    <div id="flameStatus">🔥 Факел не горить</div>
    <div id="handIndicator">👋 Покажіть долоню камері</div>
    <div id="progressContainer"><div id="progressFill"></div></div>
    <div id="progressLabel">⏳ 0 с</div>
    <div id="debugPanel"></div>

    <button id="micBtn">🎙️ Увімкнути мікрофон для магії!</button>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FilesetResolver, HandLandmarker } from "@mediapipe/tasks-vision";

        // ─── КОНФІГ ────────────────────────────────────────────────────────────
        const CFG = {
            BLOW_TIME_IGNITE: 1.5, // секунд дмухання для запалювання
            BLOW_TIME_FIRST_MSG: 0.5,
            FLAME_Y_OFFSET: 0.28,
            Y_OFFSET: -0.25,
            HAND_TIMEOUT: 25, // кадрів без руки
            AMPLITUDE_THRESHOLD: 1.2,
            VOLUME_THRESHOLD: 0.04,
            LOW_FREQ_RATIO: 0.20,
            DEBUG: false,
        };

        // ─── СТАН ──────────────────────────────────────────────────────────────
        const state = {
            landmarks: null,
            handVisible: false,
            handFrames: 0,
            flameLit: false,
            micActive: false,
            audioCtx: null,
            analyser: null,
            animId: null,
            time: 0,
            blowing: false,
            blowStart: null,
            blowDur: 0,
            msgShown: false,
            torchLit: false,
            ready: false,
        };

        // ─── DOM ──────────────────────────────────────────────────────────────
        const $ = (id) => document.getElementById(id);
        const el = {
            video: $('video'),
            canvas: $('canvas'),
            loading: $('loading'),
            wish: $('wishText'),
            status: $('flameStatus'),
            handInd: $('handIndicator'),
            micBtn: $('micBtn'),
            debug: $('debugPanel'),
            progress: $('progressContainer'),
            fill: $('progressFill'),
            label: $('progressLabel'),
        };

        // ─── THREE.JS ──────────────────────────────────────────────────────────
        let scene, camera, renderer;
        let torchGroup, flameGroup, candleLight;
        let handLandmarker = null;

        // ─── СТВОРЕННЯ ФАКЕЛА ──────────────────────────────────────────────────
        function createTorchTexture() {
            const c = document.createElement('canvas');
            c.width = 512;
            c.height = 512;
            const ctx = c.getContext('2d');

            // Дерев'яне держак
            const grad = ctx.createLinearGradient(220, 200, 292, 200);
            grad.addColorStop(0, '#5D3A1A');
            grad.addColorStop(0.3, '#8B5A2B');
            grad.addColorStop(0.7, '#A67B5B');
            grad.addColorStop(1, '#5D3A1A');
            ctx.fillStyle = grad;
            ctx.shadowColor = 'rgba(0,0,0,0.4)';
            ctx.shadowBlur = 20;
            ctx.fillRect(220, 240, 72, 220);
            ctx.shadowBlur = 0;

            // Навершя (металеве кільце)
            ctx.fillStyle = '#888';
            ctx.shadowBlur = 12;
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(256, 240, 48, 16, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Гніт
            ctx.fillStyle = '#222';
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.ellipse(256, 232, 12, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Тінь
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.beginPath();
            ctx.ellipse(256, 460, 50, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            return new THREE.CanvasTexture(c);
        }

        function buildTorch() {
            torchGroup = new THREE.Group();
            torchGroup.visible = false;
            scene.add(torchGroup);

            // Спрайт факела
            const tex = createTorchTexture();
            const mat = new THREE.SpriteMaterial({
                map: tex,
                transparent: true,
                depthTest: false,
                sizeAttenuation: true,
            });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(2.6, 2.6, 1);
            torchGroup.add(sprite);

            // Полум'я (група)
            flameGroup = new THREE.Group();
            flameGroup.position.y = CFG.FLAME_Y_OFFSET;
            flameGroup.visible = false;
            torchGroup.add(flameGroup);

            // Три шари полум'я
            const shape = new THREE.Shape();
            shape.moveTo(0, 0);
            shape.bezierCurveTo(0.06, 0.12, 0.05, 0.34, 0, 0.45);
            shape.bezierCurveTo(-0.05, 0.34, -0.06, 0.12, 0, 0);
            const geo = new THREE.ExtrudeGeometry(shape, {
                depth: 0.025,
                bevelEnabled: false,
                curveSegments: 28,
            });
            geo.rotateX(Math.PI / 2);
            geo.translate(0, 0.08, 0);

            const layers = [
                { color: 0xFFFF00, emissive: 0xFFAA00, opacity: 0.95, scale: 1.2 },
                { color: 0xFF8800, emissive: 0xFF6600, opacity: 0.70, scale: 1.6 },
                { color: 0xFF3300, emissive: 0xFF2200, opacity: 0.45, scale: 2.0 },
            ];

            layers.forEach((p, i) => {
                const m = new THREE.MeshPhongMaterial({
                    color: p.color,
                    emissive: p.emissive,
                    emissiveIntensity: 1.4,
                    transparent: true,
                    opacity: p.opacity,
                    shininess: 40,
                    side: THREE.DoubleSide,
                });
                const mesh = new THREE.Mesh(geo.clone(), m);
                mesh.scale.set(p.scale, 1 + i * 0.08, 1);
                mesh.position.y = i * 0.02;
                flameGroup.add(mesh);
            });

            // Світло від полум'я
            candleLight = new THREE.PointLight(0xFFA500, 0, 0, 4);
            candleLight.position.set(0, CFG.FLAME_Y_OFFSET + 0.15, 0.1);
            torchGroup.add(candleLight);
        }

        // ─── ІНІЦІАЛІЗАЦІЯ THREE.JS ──────────────────────────────────────────
        function initThree() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x0d0d2b, 4, 12);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 50);
            camera.position.set(0, 0, 5.5);

            renderer = new THREE.WebGLRenderer({
                canvas: el.canvas,
                alpha: true,
                antialias: true,
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;

            // Світло
            const amb = new THREE.AmbientLight(0x404060, 0.8);
            scene.add(amb);
            const dir = new THREE.DirectionalLight(0xffeedd, 1.0);
            dir.position.set(4, 6, 8);
            scene.add(dir);
            const back = new THREE.DirectionalLight(0x4488ff, 0.3);
            back.position.set(-3, 2, -5);
            scene.add(back);

            buildTorch();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // ─── КАМЕРА ────────────────────────────────────────────────────────────
        async function setupCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'environment',
                    width: { ideal: 1280 },
                    height: { ideal: 720 },
                },
            });
            el.video.srcObject = stream;
            await new Promise((r) => {
                el.video.onloadedmetadata = () => {
                    el.video.play();
                    r();
                };
            });
            // Відео дзеркалиться через CSS (transform: scaleX(-1))
        }

        // ─── HAND TRACKING ─────────────────────────────────────────────────────
        async function initHandTracking() {
            const vision = await FilesetResolver.forVisionTasks(
                'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm'
            );
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
                    delegate: 'GPU',
                },
                runningMode: 'VIDEO',
                numHands: 1,
            });
        }

        // ─── МІКРОФОН ──────────────────────────────────────────────────────────
        async function startMicrophone() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                    },
                });
                state.audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                const src = state.audioCtx.createMediaStreamSource(stream);
                state.analyser = state.audioCtx.createAnalyser();
                state.analyser.fftSize = 512;
                state.analyser.smoothingTimeConstant = 0.35;
                src.connect(state.analyser);
                state.micActive = true;

                el.micBtn.classList.add('mic-on');
                el.micBtn.textContent = '🎤 Мікрофон увімкнено!';
                setTimeout(() => {
                    el.micBtn.textContent = '🎤 Дмухай!';
                }, 1200);

                // Показуємо прогрес-бар
                if (!state.flameLit) {
                    el.progress.style.display = 'block';
                    el.label.style.display = 'block';
                }
            } catch (e) {
                console.error('Мікрофон недоступний', e);
                alert('❌ Дозвольте доступ до мікрофона, щоб запалити факел! 🎤');
                throw e;
            }
        }

        function stopMicrophone() {
            if (state.audioCtx) {
                state.audioCtx.close().catch(() => {});
                state.audioCtx = null;
            }
            state.analyser = null;
            state.micActive = false;
            el.micBtn.classList.remove('mic-on');
            el.micBtn.textContent = '🎙️ Увімкнути мікрофон';
            el.progress.style.display = 'none';
            el.label.style.display = 'none';
        }

        // ─── ОБРОБКА ПОДУВУ ────────────────────────────────────────────────────
        function analyzeBlow() {
            if (!state.analyser || state.flameLit) return false;

            const data = new Uint8Array(state.analyser.fftSize);
            state.analyser.getByteTimeDomainData(data);
            let sum = 0;
            for (let i = 0; i < data.length; i++) {
                sum += Math.abs(data[i] - 128);
            }
            const amplitude = sum / data.length;

            const freq = new Uint8Array(state.analyser.frequencyBinCount);
            state.analyser.getByteFrequencyData(freq);
            let total = 0,
                low = 0;
            const lowCount = Math.floor(freq.length * 0.2);
            for (let i = 0; i < freq.length; i++) {
                total += freq[i];
                if (i < lowCount) low += freq[i];
            }
            const volume = total / (freq.length * 255);
            const lowRatio = total > 0 ? low / total : 0;

            const blow = amplitude > CFG.AMPLITUDE_THRESHOLD &&
                lowRatio > CFG.LOW_FREQ_RATIO &&
                volume > CFG.VOLUME_THRESHOLD;

            return blow;
        }

        function updateBlowProgress() {
            if (state.flameLit || !state.micActive) return;

            const blowing = analyzeBlow();
            const now = performance.now();

            if (blowing) {
                if (!state.blowing) {
                    state.blowing = true;
                    state.blowStart = now;
                    state.blowDur = 0;
                    state.msgShown = false;
                } else {
                    state.blowDur = (now - state.blowStart) / 1000;
                    const pct = Math.min(state.blowDur / CFG.BLOW_TIME_IGNITE, 1);
                    el.fill.style.width = (pct * 100) + '%';
                    el.label.textContent = `⏳ ${Math.min(Math.floor(state.blowDur), CFG.BLOW_TIME_IGNITE)} с`;

                    if (state.blowDur >= CFG.BLOW_TIME_FIRST_MSG && !state.msgShown) {
                        state.msgShown = true;
                        el.wish.textContent = '💨 Дмухай сильніше!';
                        el.wish.style.color = '#FF6F00';
                        el.wish.style.borderColor = '#FF6F00';
                    }

                    if (state.blowDur >= CFG.BLOW_TIME_IGNITE && !state.torchLit) {
                        igniteTorch();
                    }
                }
            } else {
                if (state.blowing) {
                    state.blowing = false;
                    el.fill.style.width = '0%';
                    el.label.textContent = '⏳ 0 с';
                    if (!state.torchLit) {
                        el.wish.textContent = '🔥 Дмухай на факел, щоб запалити!';
                        el.wish.style.color = '#FFD700';
                        el.wish.style.borderColor = '#FFD700';
                    }
                }
            }
        }

        // ─── ЗАПАЛЕННЯ ──────────────────────────────────────────────────────────
        function igniteTorch() {
            if (state.torchLit) return;
            state.torchLit = true;
            state.flameLit = true;
            flameGroup.visible = true;
            torchGroup.visible = true;
            candleLight.intensity = 1.2;

            el.status.textContent = '🔥 Факел запалено! 🎉';
            el.status.classList.add('lit');
            el.wish.textContent = '🎉 Відкривай конверт № 5 🎉';
            el.wish.classList.add('lit');
            el.progress.style.display = 'none';
            el.label.style.display = 'none';
            el.micBtn.classList.add('hidden');

            // Звук запалення
            playIgniteSound();

            // Автоматично вимикаємо мікрофон
            setTimeout(() => {
                if (state.micActive) stopMicrophone();
            }, 500);
        }

        function playIgniteSound() {
            if (!state.audioCtx) return;
            try {
                const osc = state.audioCtx.createOscillator();
                const gain = state.audioCtx.createGain();
                osc.connect(gain);
                gain.connect(state.audioCtx.destination);
                osc.frequency.setValueAtTime(500, state.audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, state.audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.25, state.audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, state.audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(state.audioCtx.currentTime + 0.5);
            } catch (_) {}
        }

        // ─── ОНОВЛЕННЯ ПОЗИЦІЇ ФАКЕЛА ─────────────────────────────────────────
        function updateTorchPosition() {
            if (!state.landmarks) return;
            const tip = state.landmarks[12]; // кінчик середнього пальця
            const x = (tip.x - 0.5) * 8;
            const y = (0.5 - tip.y) * 6;
            torchGroup.position.set(x, y + CFG.Y_OFFSET, 0.05);
            torchGroup.lookAt(camera.position);
        }

        // ─── АНІМАЦІЯ ПОЛУМ'Я ──────────────────────────────────────────────────
        function animateFlame() {
            if (!flameGroup || !state.flameLit) return;
            const t = state.time;
            const s1 = 1 + Math.sin(t * 14 + 0.3) * 0.13;
            const s2 = 1 + Math.sin(t * 10 + 1.8) * 0.11;
            const s3 = 1 + Math.sin(t * 7 + 2.9) * 0.09;
            const offY = Math.sin(t * 6.5) * 0.035;
            const rotZ = Math.sin(t * 4.8) * 0.07;
            flameGroup.children.forEach((child, i) => {
                if (i < 3) {
                    const sc = i === 0 ? s1 : i === 1 ? s2 : s3;
                    child.scale.set(sc, sc * 0.92, sc);
                    child.position.y = offY + i * 0.02;
                }
            });
            flameGroup.rotation.z = rotZ;
            // Пульсація світла
            candleLight.intensity = 0.8 + Math.sin(t * 12) * 0.3 + Math.sin(t * 7 + 1) * 0.15;
        }

        // ─── ГОЛОВНИЙ ЦИКЛ ─────────────────────────────────────────────────────
        function update() {
            state.time += 0.016;

            // Hand detection
            if (handLandmarker && el.video.readyState >= 2) {
                try {
                    const results = handLandmarker.detectForVideo(el.video, performance.now());
                    if (results.landmarks && results.landmarks.length > 0) {
                        state.landmarks = results.landmarks[0];
                        state.handVisible = true;
                        state.handFrames = 0;
                    } else {
                        state.landmarks = null;
                        state.handVisible = false;
                        state.handFrames++;
                    }
                } catch (_) {
                    state.landmarks = null;
                    state.handVisible = false;
                    state.handFrames++;
                }
            }

            // Відображення факела
            if (state.handVisible && state.landmarks) {
                updateTorchPosition();
                if (!torchGroup.visible && !state.flameLit) {
                    torchGroup.visible = true;
                    el.wish.style.display = 'block';
                    el.status.style.display = 'block';
                    el.handInd.style.display = 'none';
                    if (state.micActive && !state.flameLit) {
                        el.progress.style.display = 'block';
                        el.label.style.display = 'block';
                    }
                } else if (!torchGroup.visible && state.flameLit) {
                    torchGroup.visible = true;
                }
            } else {
                if (torchGroup.visible && !state.flameLit) {
                    torchGroup.visible = false;
                    el.wish.style.display = 'none';
                    el.status.style.display = 'none';
                    el.progress.style.display = 'none';
                    el.label.style.display = 'none';
                }
                if (state.handFrames > CFG.HAND_TIMEOUT && !state.flameLit) {
                    el.handInd.style.display = 'flex';
                }
            }

            // Аналіз подуву
            if (state.micActive && state.handVisible && !state.flameLit) {
                updateBlowProgress();
            } else if (state.micActive && !state.handVisible && !state.flameLit) {
                // Скидаємо прогрес, якщо руки немає
                if (state.blowing) {
                    state.blowing = false;
                    el.fill.style.width = '0%';
                    el.label.textContent = '⏳ 0 с';
                    el.wish.textContent = '🔥 Дмухай на факел, щоб запалити!';
                    el.wish.style.color = '#FFD700';
                    el.wish.style.borderColor = '#FFD700';
                }
            }

            // Анімація полум'я
            if (state.flameLit) {
                animateFlame();
                // Якщо полум'я запалене, але факел невидимий через руку — показуємо
                if (!torchGroup.visible) {
                    torchGroup.visible = true;
                    flameGroup.visible = true;
                }
            }

            // Debug
            if (CFG.DEBUG) {
                el.debug.style.display = 'block';
                el.debug.innerHTML = `
              <div>Полум'я: ${state.flameLit ? '🔥 ГОРИТЬ' : '❌ НІ'}</div>
              <div>Подих: ${state.blowing ? '💨 Так' : '⏸ Ні'}</div>
              <div>Дур.: ${state.blowDur.toFixed(1)}с</div>
              <div>Рука: ${state.handVisible ? '✅' : '❌'}</div>
              <div>Мікр.: ${state.micActive ? '🎤' : '🔇'}</div>
            `;
            } else {
                el.debug.style.display = 'none';
            }

            renderer.render(scene, camera);
            state.animId = requestAnimationFrame(update);
        }

        // ─── ЗАПУСК ────────────────────────────────────────────────────────────
        async function initApp() {
            try {
                await setupCamera();
                initThree();
                await initHandTracking();

                // Показуємо UI
                el.loading.classList.add('hidden');
                setTimeout(() => { el.loading.style.display = 'none'; }, 800);
                el.video.style.display = 'block';
                el.canvas.style.display = 'block';
                el.handInd.style.display = 'flex';
                el.micBtn.style.display = 'block';

                state.ready = true;
                update();

            } catch (err) {
                console.error('Помилка ініціалізації:', err);
                el.loading.innerHTML = `
              <div style="font-size:3rem;margin-bottom:16px;">😕</div>
              <div style="font-size:1.2rem;margin-bottom:12px;">Не вдалося запустити</div>
              <div style="font-size:0.95rem;color:rgba(255,255,255,0.7);max-width:320px;">
                ${err.message || 'Перезавантажте сторінку та дозвольте доступ до камери та мікрофона.'}
              </div>
              <button onclick="location.reload()" style="margin-top:24px;padding:12px 32px;border-radius:30px;border:2px solid #FFD700;background:transparent;color:#FFD700;font-size:1.1rem;cursor:pointer;">
                🔄 Спробувати знову
              </button>
            `;
            }
        }

        // ─── ПОДІЇ ─────────────────────────────────────────────────────────────
        el.micBtn.addEventListener('click', async () => {
            if (state.micActive) {
                stopMicrophone();
                el.micBtn.classList.remove('mic-on');
                el.micBtn.textContent = '🎙️ Увімкнути мікрофон';
                return;
            }
            try {
                await startMicrophone();
                // Якщо рука вже видима, показуємо прогрес
                if (state.handVisible && !state.flameLit) {
                    el.progress.style.display = 'block';
                    el.label.style.display = 'block';
                }
            } catch (_) {}
        });

        // Клавіша D для дебагу
        document.addEventListener('keydown', (e) => {
            if (e.key === 'd' || e.key === 'D') {
                CFG.DEBUG = !CFG.DEBUG;
                if (!CFG.DEBUG) el.debug.style.display = 'none';
            }
        });

        // Запуск
        initApp();
    </script>
</body>
</html>
