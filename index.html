<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🔥 Запали факел!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: manipulation;
    }
    body {
      background: linear-gradient(135deg, #1a0a2e 0%, #0d0d2b 100%);
      overflow: hidden;
      font-family: 'Arial', 'Segoe UI', system-ui, sans-serif;
      color: white;
      height: 100vh;
      width: 100vw;
    }
    #video, #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #video { z-index: 1; display: none; }
    #canvas { z-index: 2; display: none; }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a0a2e 0%, #0d0d2b 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      text-align: center;
      padding: 20px;
    }
    .loader {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid #FFD700;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    #wishText {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: #FFD700;
      padding: 14px 22px;
      border-radius: 20px;
      font-size: clamp(1rem, 5vw, 1.6rem);
      font-weight: bold;
      z-index: 85;
      text-align: center;
      border: 2px solid #FFD700;
      display: none;
      max-width: 90%;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      line-height: 1.4;
    }

    #handIndicator {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: #FFD700;
      padding: 12px 20px;
      border-radius: 20px;
      border: 2px solid rgba(255, 215, 0, 0.5);
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 99;
      font-size: clamp(0.9rem, 3.5vw, 1.2rem);
      font-weight: bold;
      backdrop-filter: blur(10px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    #flameStatus {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #FF4500 0%, #FF6347 100%);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: clamp(0.9rem, 3.5vw, 1.2rem);
      z-index: 100;
      display: none;
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 20px rgba(255, 69, 0, 0.6);
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    #micBtn {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FF4500 0%, #FF6347 100%);
      border: 3px solid #FFD700;
      color: white;
      font-size: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 0 30px rgba(255, 69, 0, 0.7);
      transition: all 0.3s ease;
      touch-action: manipulation;
    }
    #micBtn:active {
      transform: translateX(-50%) scale(0.9);
    }

    #progressContainer {
      position: fixed;
      bottom: 190px;
      left: 50%;
      transform: translateX(-50%);
      width: min(280px, 80%);
      height: 18px;
      background: rgba(255,255,255,0.15);
      border-radius: 30px;
      z-index: 90;
      display: none;
      overflow: hidden;
      border: 2px solid rgba(255,215,0,0.4);
      backdrop-filter: blur(4px);
      box-shadow: 0 0 20px rgba(255,215,0,0.2);
    }
    #progressFill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #FFD700, #FF4500);
      border-radius: 30px;
      transition: width 0.2s ease;
      box-shadow: 0 0 15px #FFD700;
    }
    #progressLabel {
      position: fixed;
      bottom: 212px;
      left: 50%;
      transform: translateX(-50%);
      color: #FFD700;
      font-size: clamp(0.7rem, 2.5vw, 1rem);
      z-index: 91;
      display: none;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(255,215,0,0.5);
    }

    #debugPanel {
      position: fixed;
      top: 130px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: #4CAF50;
      padding: 12px;
      border-radius: 10px;
      font-family: monospace;
      font-size: 10px;
      z-index: 200;
      display: none;
      border: 1px solid #4CAF50;
      backdrop-filter: blur(5px);
      max-width: 200px;
      pointer-events: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes flameFlicker {
      0%, 100% { transform: scale(1) translateY(0); opacity: 0.95; }
      33% { transform: scale(1.1) translateY(-2px); opacity: 1; }
      66% { transform: scale(0.95) translateY(2px); opacity: 0.9; }
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 30px rgba(255, 69, 0, 0.7); }
      50% { box-shadow: 0 0 60px rgba(255, 69, 0, 1); }
    }

    /* Адаптивність для маленьких екранів */
    @media (max-width: 480px) {
      #wishText { bottom: 20px; padding: 12px 16px; }
      #handIndicator { top: 10px; padding: 8px 16px; }
      #flameStatus { top: 60px; padding: 8px 16px; }
      #micBtn { width: 60px; height: 60px; font-size: 26px; bottom: 80px; }
      #progressContainer { bottom: 155px; height: 14px; }
      #progressLabel { bottom: 175px; }
    }
    @media (max-height: 700px) {
      #micBtn { width: 55px; height: 55px; font-size: 22px; bottom: 60px; }
      #progressContainer { bottom: 130px; }
      #progressLabel { bottom: 150px; }
      #wishText { bottom: 10px; padding: 8px 14px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loader"></div>
    <div style="font-size: 1.5em; margin-bottom: 10px;">🔥 Завантаження...</div>
    <p style="margin-top: 20px; color: rgba(255,255,255,0.9);">Покажіть долоню камері</p>
  </div>

  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div id="wishText">🔥 Дмухай на факел, щоб запалити!</div>
  <div id="flameStatus">🔥 Факел не горить</div>
  <div id="handIndicator">👋 Покажіть долоню камері</div>
  <div id="progressContainer"><div id="progressFill"></div></div>
  <div id="progressLabel">⏳ 0 с</div>
  <div id="debugPanel"></div>
  <button id="micBtn">🎤</button>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';
    import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm";

    // ---------- КОНФІГ ----------
    const CONFIG = {
      SMOOTHING_FACTOR: 0.6,
      HAND_NOT_DETECTED_THRESHOLD: 30,
      // Пороги для детекції сильного подиху
      AMPLITUDE_THRESHOLD: 2.5,
      LOW_FREQ_RATIO: 0.45,
      VOLUME_THRESHOLD: 0.08,
      EXTREME_VOLUME_THRESHOLD: 0.15,
      FREQUENCY_MAX: 250,
      // Час для запалення
      BLOW_TIME_FIRST_MSG: 3,    // 3 секунди – "Дмухай сильніше"
      BLOW_TIME_IGNITE: 8,       // 8 секунд – запалення
      DEBUG_MODE: false
    };

    // Стан додатку
    const state = {
      landmarks: null,
      isHandVisible: false,
      handFrames: 0,
      isFlameLit: false,          // спочатку не горить
      isMicActive: false,
      audioContext: null,
      analyser: null,
      animationId: null,
      time: 0,

      // Для відліку подиху
      isBlowing: false,
      blowStartTime: null,
      blowDuration: 0,
      msg3sShown: false,
      torchLit: false
    };

    // DOM
    const el = {
      video: document.getElementById('video'),
      canvas: document.getElementById('canvas'),
      loading: document.getElementById('loading'),
      wishText: document.getElementById('wishText'),
      flameStatus: document.getElementById('flameStatus'),
      handIndicator: document.getElementById('handIndicator'),
      micBtn: document.getElementById('micBtn'),
      debugPanel: document.getElementById('debugPanel'),
      progressContainer: document.getElementById('progressContainer'),
      progressFill: document.getElementById('progressFill'),
      progressLabel: document.getElementById('progressLabel')
    };

    // Three.js змінні
    let scene, camera, renderer;
    let torchSprite, candle, flameGroup;
    let handLandmarker;

    // ---------- ОСНОВНИЙ КЛАС ----------
    class TorchARApp {
      constructor() {
        this.init();
      }

      async init() {
        try {
          await this.setupCamera();
          await this.initThreeJS();
          await this.initHandTracking();
          this.setupEventListeners();
          this.hideLoading();
          this.startAnimation();
        } catch (error) {
          console.error('Помилка ініціалізації:', error);
          this.showError('Перезавантажте сторінку та дозвольте доступ до камери');
        }
      }

      // ---------- КАМЕРА ----------
      async setupCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        el.video.srcObject = stream;
        await new Promise(resolve => {
          el.video.onloadedmetadata = () => { el.video.play(); resolve(); };
        });
      }

      // ---------- THREE.JS ----------
      async initThreeJS() {
        scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x1a0a2e, 5, 15);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);

        renderer = new THREE.WebGLRenderer({ canvas: el.canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Світло
        const ambient = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // Завантажуємо / малюємо факел
        await this.createTorchSprite();

        // Створюємо свічку (полум'я)
        this.createBeautifulCandle();

        // Початково ховаємо полум'я
        candle.visible = false;
        flameGroup.visible = false;
      }

      createTorchSprite() {
        return new Promise((resolve) => {
          // Спроба завантажити зовнішнє зображення (якщо є)
          const loader = new THREE.TextureLoader();
          loader.load(
            'torch.png', // якщо є таке фото – використати
            (texture) => {
              const mat = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
              torchSprite = new THREE.Sprite(mat);
              torchSprite.scale.set(2.8, 2.8, 1);
              torchSprite.visible = false;
              scene.add(torchSprite);
              resolve();
            },
            undefined,
            () => {
              // Якщо немає – малюємо факел на canvas
              console.warn('Фото факела не знайдено, малюємо вбудований факел');
              this.createFallbackTorch();
              resolve();
            }
          );
        });
      }

      createFallbackTorch() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        // Ручка (дерев'яна)
        ctx.fillStyle = '#8B5A2B';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 15;
        ctx.fillRect(220, 280, 72, 200);
        ctx.shadowBlur = 0;

        // Верхівка (металева чашка)
        ctx.fillStyle = '#555';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.ellipse(256, 280, 60, 25, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Полум'я (поки що темне – буде запалюватись окремо)
        ctx.fillStyle = '#2a1a0a';
        ctx.beginPath();
        ctx.ellipse(256, 240, 40, 50, 0, 0, Math.PI * 2);
        ctx.fill();

        // Контур полум'я
        ctx.strokeStyle = '#ff8800';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(256, 240, 42, 52, 0, 0, Math.PI * 2);
        ctx.stroke();

        // Напис "ФАКЕЛ"
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 36px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText('🔥', 256, 480);

        const texture = new THREE.CanvasTexture(canvas);
        const mat = new THREE.SpriteMaterial({ map: texture, transparent: true });
        torchSprite = new THREE.Sprite(mat);
        torchSprite.scale.set(2.8, 2.8, 1);
        torchSprite.visible = false;
        scene.add(torchSprite);
      }

      createBeautifulCandle() {
        candle = new THREE.Group();
        candle.visible = false;
        scene.add(candle);

        // Тіло свічки (символічне, буде заховано під факелом)
        const bodyGeo = new THREE.CylinderGeometry(0.06, 0.07, 0.6, 16);
        const bodyMat = new THREE.MeshPhongMaterial({ color: 0xF5F5DC, shininess: 80 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.2;
        candle.add(body);

        // Гніт
        const wickGeo = new THREE.CylinderGeometry(0.008, 0.008, 0.03, 8);
        const wickMat = new THREE.MeshPhongMaterial({ color: 0x333333 });
        const wick = new THREE.Mesh(wickGeo, wickMat);
        wick.position.y = 0.42;
        candle.add(wick);

        // Полум'я (група)
        this.createNaturalFlame();

        // Світло від полум'я
        const light = new THREE.PointLight(0xFFA500, 1.2, 2.5);
        light.position.set(0, 0.48, 0);
        candle.add(light);
      }

      createNaturalFlame() {
        flameGroup = new THREE.Group();
        flameGroup.position.y = 0.46;
        flameGroup.visible = false;
        candle.add(flameGroup);

        const shape = new THREE.Shape();
        shape.moveTo(0, 0);
        shape.bezierCurveTo(0.05, 0.1, 0.04, 0.3, 0, 0.4);
        shape.bezierCurveTo(-0.04, 0.3, -0.05, 0.1, 0, 0);

        const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.02, bevelEnabled: false, curveSegments: 24 });
        geo.rotateX(Math.PI / 2);
        geo.translate(0, 0.2, 0);

        // Шари полум'я
        const colors = [0xFFFF00, 0xFF8800, 0xFF3300];
        const emissive = [0xFFAA00, 0xFF6600, 0xFF2200];
        const opacities = [0.95, 0.7, 0.5];
        const scales = [1.2, 1.5, 1.8];

        for (let i = 0; i < 3; i++) {
          const mat = new THREE.MeshPhongMaterial({
            color: colors[i],
            emissive: emissive[i],
            emissiveIntensity: 1.2,
            transparent: true,
            opacity: opacities[i],
            shininess: 60
          });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.scale.set(scales[i], 1 + i * 0.1, 1);
          flameGroup.add(mesh);
        }

        // Дим
        const smokeGeo = new THREE.SphereGeometry(0.06, 8, 8);
        const smokeMat = new THREE.MeshBasicMaterial({ color: 0x888888, transparent: true, opacity: 0.15 });
        const smoke = new THREE.Mesh(smokeGeo, smokeMat);
        smoke.position.y = 0.25;
        flameGroup.add(smoke);
      }

      // ---------- HAND TRACKING ----------
      async initHandTracking() {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
        );
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numHands: 1
        });
      }

      // ---------- ПОДІЇ ----------
      setupEventListeners() {
        el.micBtn.addEventListener('click', () => this.toggleMicrophone());
        window.addEventListener('resize', () => this.onWindowResize());
        document.addEventListener('keydown', (e) => {
          if (e.key === 'd') {
            CONFIG.DEBUG_MODE = !CONFIG.DEBUG_MODE;
            el.debugPanel.style.display = CONFIG.DEBUG_MODE ? 'block' : 'none';
          }
        });
      }

      toggleMicrophone() {
        if (state.isMicActive) {
          this.stopMicrophone();
          el.micBtn.style.background = 'linear-gradient(135deg, #FF4500 0%, #FF6347 100%)';
          el.micBtn.innerHTML = '🎤';
        } else {
          this.startMicrophone();
          el.micBtn.style.background = 'linear-gradient(135deg, #4CAF50 0%, #45a049 100%)';
          el.micBtn.innerHTML = '🎙️';
        }
      }

      async startMicrophone() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
          });
          state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const source = state.audioContext.createMediaStreamSource(stream);
          state.analyser = state.audioContext.createAnalyser();
          state.analyser.fftSize = 512;
          state.analyser.smoothingTimeConstant = 0.3;
          state.analyser.minDecibels = -90;
          state.analyser.maxDecibels = -10;
          source.connect(state.analyser);
          state.isMicActive = true;
        } catch (e) {
          console.error('Мікрофон не доступний', e);
          alert('Дозвольте доступ до мікрофона, щоб запалити факел! 🎤');
        }
      }

      stopMicrophone() {
        if (state.audioContext) state.audioContext.close();
        state.analyser = null;
        state.isMicActive = false;
        el.progressContainer.style.display = 'none';
        el.progressLabel.style.display = 'none';
      }

      // ---------- ОСНОВНИЙ ЦИКЛ ----------
      startAnimation() {
        const animate = () => {
          state.time += 0.016;
          this.update();
          this.render();
          state.animationId = requestAnimationFrame(animate);
        };
        animate();
      }

      update() {
        this.detectHand();

        if (state.landmarks && state.isHandVisible) {
          this.updatePosition();

          if (!torchSprite.visible) {
            torchSprite.visible = true;
            candle.visible = state.isFlameLit; // запалено – показуємо полум'я
            flameGroup.visible = state.isFlameLit;
            el.wishText.style.display = 'block';
            el.flameStatus.style.display = 'block';
            el.handIndicator.style.display = 'none';
            // Показуємо прогрес-бар, якщо мікрофон активний
            if (state.isMicActive && !state.isFlameLit) {
              el.progressContainer.style.display = 'block';
              el.progressLabel.style.display = 'block';
            }
          }
        } else {
          if (torchSprite.visible) {
            torchSprite.visible = false;
            candle.visible = false;
            flameGroup.visible = false;
            el.wishText.style.display = 'none';
            el.flameStatus.style.display = 'none';
            el.progressContainer.style.display = 'none';
            el.progressLabel.style.display = 'none';
          }
          if (state.handFrames > CONFIG.HAND_NOT_DETECTED_THRESHOLD) {
            el.handIndicator.style.display = 'flex';
          }
        }

        // Анімація полум'я (якщо горить)
        if (state.isFlameLit && flameGroup && flameGroup.visible) {
          this.animateFlame();
        }

        // Перевірка подиху (тільки якщо факел не горить і мікрофон активний)
        if (!state.isFlameLit && state.isMicActive && state.analyser) {
          this.checkBlowForIgnite();
        } else if (state.isFlameLit) {
          // Якщо факел горить – ховаємо прогрес
          el.progressContainer.style.display = 'none';
          el.progressLabel.style.display = 'none';
        }

        // Оновлення відладочної панелі
        if (CONFIG.DEBUG_MODE) {
          this.updateDebugPanel();
        }
      }

      // ---------- ДЕТЕКЦІЯ РУКИ ----------
      detectHand() {
        if (!handLandmarker || el.video.readyState < 2) return;
        try {
          const results = handLandmarker.detectForVideo(el.video, performance.now());
          if (results.landmarks && results.landmarks.length > 0) {
            state.landmarks = results.landmarks[0];
            state.isHandVisible = true;
            state.handFrames = 0;
          } else {
            state.landmarks = null;
            state.isHandVisible = false;
            state.handFrames++;
          }
        } catch (e) { console.error(e); }
      }

      updatePosition() {
        if (!state.landmarks) return;
        const points = [0, 5, 9, 13, 17];
        let cx = 0, cy = 0;
        for (const idx of points) {
          cx += state.landmarks[idx].x;
          cy += state.landmarks[idx].y;
        }
        cx /= points.length;
        cy /= points.length;
        const x = (cx - 0.5) * 8;
        const y = (0.5 - cy) * 6;
        if (torchSprite) {
          torchSprite.position.set(x, y - 0.5, 0);
          torchSprite.lookAt(camera.position);
        }
        if (candle) {
          candle.position.set(x, y - 0.2, 0);
          candle.lookAt(camera.position);
        }
      }

      animateFlame() {
        if (!flameGroup || !state.isFlameLit) return;
        const t = state.time;
        const s1 = 1 + Math.sin(t * 15) * 0.12;
        const s2 = 1 + Math.sin(t * 11 + 1.5) * 0.1;
        const s3 = 1 + Math.sin(t * 8 + 2.5) * 0.08;
        const offY = Math.sin(t * 7) * 0.03;
        const rotZ = Math.sin(t * 5) * 0.08;
        flameGroup.children.forEach((layer, i) => {
          if (i < 3) {
            const sc = i === 0 ? s1 : i === 1 ? s2 : s3;
            layer.scale.set(sc, sc * 0.9, sc);
            layer.position.y = offY;
          }
        });
        flameGroup.rotation.z = rotZ;
        // Колір
        if (flameGroup.children[0]) {
          const hue = 0.15 + Math.sin(t * 3) * 0.1;
          flameGroup.children[0].material.color.setHSL(hue, 1, 0.6);
        }
      }

      // ---------- НОВА ЛОГІКА: ЗАПАЛЕННЯ ФАКЕЛА ----------
      checkBlowForIgnite() {
        if (!state.analyser || state.isFlameLit) return;

        const timeData = new Uint8Array(state.analyser.fftSize);
        state.analyser.getByteTimeDomainData(timeData);
        let ampSum = 0;
        for (let i = 0; i < timeData.length; i++) {
          ampSum += Math.abs(timeData[i] - 128);
        }
        const amplitude = ampSum / timeData.length;

        const freqData = new Uint8Array(state.analyser.frequencyBinCount);
        state.analyser.getByteFrequencyData(freqData);
        let sumFreq = 0;
        for (let i = 0; i < freqData.length; i++) sumFreq += freqData[i];
        const avgFreq = sumFreq / freqData.length;
        const volume = avgFreq / 255;

        // Частка низьких частот
        const lowCount = Math.floor(freqData.length * 0.2);
        let lowSum = 0;
        for (let i = 0; i < lowCount; i++) lowSum += freqData[i];
        const lowRatio = sumFreq > 0 ? lowSum / sumFreq : 0;

        // Домінантна частота
        let maxVal = 0, maxIdx = 0;
        for (let i = 0; i < freqData.length; i++) {
          if (freqData[i] > maxVal) { maxVal = freqData[i]; maxIdx = i; }
        }
        const domFreq = maxIdx * (state.audioContext.sampleRate / 2) / freqData.length;

        // Критерії сильного подиху
        const isStrongBlow = amplitude > CONFIG.AMPLITUDE_THRESHOLD &&
                             lowRatio > CONFIG.LOW_FREQ_RATIO &&
                             volume > CONFIG.VOLUME_THRESHOLD;

        const isExtremeBlow = volume > CONFIG.EXTREME_VOLUME_THRESHOLD &&
                              (domFreq < CONFIG.FREQUENCY_MAX || lowRatio > 0.8);

        const blowDetected = isStrongBlow || isExtremeBlow;

        // Відладка
        if (CONFIG.DEBUG_MODE) {
          console.log(`💨 amp=${amplitude.toFixed(2)} low=${(lowRatio*100).toFixed(0)}% vol=${(volume*100).toFixed(0)}% freq=${domFreq.toFixed(0)}Hz → ${blowDetected ? 'ПОДИХ' : 'тиша'}`);
        }

        const now = Date.now();

        if (blowDetected) {
          if (!state.isBlowing) {
            // Початок подиху
            state.isBlowing = true;
            state.blowStartTime = now;
            state.blowDuration = 0;
            state.msg3sShown = false;
            // Показуємо прогрес
            el.progressContainer.style.display = 'block';
            el.progressLabel.style.display = 'block';
          } else {
            // Оновлюємо тривалість
            state.blowDuration = (now - state.blowStartTime) / 1000;
            // Оновлюємо прогрес-бар
            const progress = Math.min(state.blowDuration / CONFIG.BLOW_TIME_IGNITE, 1);
            el.progressFill.style.width = (progress * 100) + '%';
            el.progressLabel.textContent = `⏳ ${Math.min(Math.floor(state.blowDuration), CONFIG.BLOW_TIME_IGNITE)} с`;

            // Перевірка на 3 секунди
            if (state.blowDuration >= CONFIG.BLOW_TIME_FIRST_MSG && !state.msg3sShown) {
              state.msg3sShown = true;
              el.wishText.textContent = '💨 Дмухай сильніше!';
              el.wishText.style.color = '#FF4500';
              el.wishText.style.borderColor = '#FF4500';
              el.flameStatus.textContent = '💨 Дмухай!';
              el.flameStatus.style.background = 'linear-gradient(135deg, #FF8C00 0%, #FF4500 100%)';
            }

            // Перевірка на 8 секунд – запалення!
            if (state.blowDuration >= CONFIG.BLOW_TIME_IGNITE && !state.torchLit) {
              state.torchLit = true;
              this.igniteTorch();
            }
          }
        } else {
          // Подих перервався – скидаємо
          if (state.isBlowing) {
            state.isBlowing = false;
            state.blowStartTime = null;
            state.blowDuration = 0;
            state.msg3sShown = false;
            el.progressFill.style.width = '0%';
            el.progressLabel.textContent = '⏳ 0 с';
            // Повертаємо текст, якщо ще не запалили
            if (!state.torchLit) {
              el.wishText.textContent = '🔥 Дмухай на факел, щоб запалити!';
              el.wishText.style.color = '#FFD700';
              el.wishText.style.borderColor = '#FFD700';
              el.flameStatus.textContent = '🔥 Факел не горить';
              el.flameStatus.style.background = 'linear-gradient(135deg, #FF4500 0%, #FF6347 100%)';
            }
          }
        }
      }

      igniteTorch() {
        state.isFlameLit = true;
        state.torchLit = true;
        flameGroup.visible = true;
        candle.visible = true;

        // Оновлюємо інтерфейс
        el.flameStatus.textContent = '🔥 Факел запалено! 🎉';
        el.flameStatus.style.background = 'linear-gradient(135deg, #FFD700 0%, #FF8C00 100%)';
        el.flameStatus.style.boxShadow = '0 0 40px rgba(255, 215, 0, 0.9)';
        el.wishText.textContent = '🎉 Буква № 5 – Р 🎉';
        el.wishText.style.color = '#FFD700';
        el.wishText.style.borderColor = '#FFD700';
        el.wishText.style.background = 'rgba(0,0,0,0.9)';
        el.wishText.style.boxShadow = '0 0 50px rgba(255, 215, 0, 0.8)';
        el.progressContainer.style.display = 'none';
        el.progressLabel.style.display = 'none';
        el.micBtn.style.background = 'linear-gradient(135deg, #FFD700 0%, #FF8C00 100%)';
        el.micBtn.innerHTML = '🔥';

        // Звук запалення
        this.playIgniteSound();

        // Через 6 секунд скидаємо для повторної гри (або можна залишити)
        setTimeout(() => {
          this.resetTorch();
        }, 6000);
      }

      resetTorch() {
        state.isFlameLit = false;
        state.torchLit = false;
        state.isBlowing = false;
        state.blowStartTime = null;
        state.blowDuration = 0;
        state.msg3sShown = false;
        flameGroup.visible = false;
        candle.visible = false;
        el.flameStatus.textContent = '🔥 Факел не горить';
        el.flameStatus.style.background = 'linear-gradient(135deg, #FF4500 0%, #FF6347 100%)';
        el.flameStatus.style.boxShadow = '0 0 20px rgba(255, 69, 0, 0.6)';
        el.wishText.textContent = '🔥 Дмухай на факел, щоб запалити!';
        el.wishText.style.color = '#FFD700';
        el.wishText.style.borderColor = '#FFD700';
        el.wishText.style.background = 'rgba(0, 0, 0, 0.8)';
        el.wishText.style.boxShadow = '0 0 25px rgba(255, 215, 0, 0.4)';
        el.micBtn.style.background = 'linear-gradient(135deg, #4CAF50 0%, #45a049 100%)';
        el.micBtn.innerHTML = '🎙️';
        el.progressFill.style.width = '0%';
        el.progressLabel.textContent = '⏳ 0 с';
        if (state.isMicActive) {
          el.progressContainer.style.display = 'block';
          el.progressLabel.style.display = 'block';
        }
      }

      playIgniteSound() {
        if (!state.audioContext) return;
        try {
          const osc = state.audioContext.createOscillator();
          const gain = state.audioContext.createGain();
          osc.connect(gain);
          gain.connect(state.audioContext.destination);
          osc.frequency.setValueAtTime(600, state.audioContext.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1200, state.audioContext.currentTime + 0.3);
          gain.gain.setValueAtTime(0.3, state.audioContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, state.audioContext.currentTime + 0.5);
          osc.start();
          osc.stop(state.audioContext.currentTime + 0.5);
        } catch (e) { /* ignore */ }
      }

      // ---------- ВІДЛАДКА ----------
      updateDebugPanel() {
        if (!CONFIG.DEBUG_MODE) return;
        const status = state.isFlameLit ? 'ГОРИТЬ' : 'НЕ ГОРИТЬ';
        const blow = state.isBlowing ? `ТАК (${state.blowDuration.toFixed(1)}с)` : 'НІ';
        el.debugPanel.innerHTML = `
          <div>Полум'я: ${status}</div>
          <div>Подих: ${blow}</div>
          <div>Повідомлення 3с: ${state.msg3sShown ? '✅' : '❌'}</div>
          <div>Запалено: ${state.torchLit ? '✅' : '❌'}</div>
          <div style="font-size:8px;color:#888;">D = debug, R = reset</div>
        `;
        // Клавіша R для скидання (тест)
        document.addEventListener('keydown', (e) => {
          if (e.key === 'r' || e.key === 'R') {
            this.resetTorch();
          }
        });
      }

      // ---------- ДОПОМІЖНІ ----------
      render() {
        if (renderer && scene && camera) {
          renderer.render(scene, camera);
        }
      }

      onWindowResize() {
        if (camera && renderer) {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        }
      }

      hideLoading() {
        el.loading.style.display = 'none';
        el.video.style.display = 'block';
        el.canvas.style.display = 'block';
        el.handIndicator.style.display = 'flex';
      }

      showError(msg) {
        el.loading.innerHTML = `
          <div style="color:#ff6b6b;font-size:28px;margin-bottom:20px;">😕</div>
          <div style="font-size:18px;margin-bottom:20px;">${msg}</div>
          <button onclick="location.reload()" style="padding:14px 28px;background:linear-gradient(135deg,#FF4500,#FF6347);color:#fff;border:none;border-radius:25px;cursor:pointer;font-size:16px;">
            Спробувати знову
          </button>
        `;
      }

      cleanup() {
        if (state.animationId) cancelAnimationFrame(state.animationId);
        if (el.video.srcObject) el.video.srcObject.getTracks().forEach(t => t.stop());
        if (handLandmarker) handLandmarker.close();
        this.stopMicrophone();
      }
    }

    // ---------- СТАРТ ----------
    window.addEventListener('DOMContentLoaded', () => {
      const app = new TorchARApp();
      window.addEventListener('beforeunload', () => app.cleanup());
    });
  </script>
